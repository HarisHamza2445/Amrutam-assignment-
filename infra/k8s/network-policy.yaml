# Only the ingress controller may talk to the API; only prometheus may scrape the worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amrutam-api-ingress
spec:
  podSelector:
    matchLabels: { app: amrutam-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 4000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amrutam-worker-ingress
spec:
  podSelector:
    matchLabels: { app: amrutam-worker }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 9464 }]
