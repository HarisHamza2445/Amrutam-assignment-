apiVersion: apps/v1
kind: Deployment
metadata:
  name: amrutam-api
  labels: { app: amrutam-api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: amrutam-api }
  template:
    metadata:
      labels: { app: amrutam-api }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      # spread replicas over zones so losing one AZ doesn't take the API down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: amrutam-api }
      containers:
        - name: api
          image: amrutam-api
          ports: [{ containerPort: 4000, name: http }]
          envFrom:
            - configMapRef: { name: amrutam-config }
            - secretRef: { name: amrutam-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: amrutam-api }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # give the load balancer time to stop sending traffic before we close the server
            preStop:
              exec: { command: ['sleep', '5'] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: amrutam-api
spec:
  selector: { app: amrutam-api }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amrutam-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: amrutam-api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amrutam-api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: amrutam-api }
